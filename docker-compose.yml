services:
  db:
    image: ankane/pgvector:v0.5.1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edb_secret}
      POSTGRES_DB: ${POSTGRES_DB:-edb_circulars}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edb} -d ${POSTGRES_DB:-edb_circulars}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Optional MinIO (Docker Hub may require login). Default app uses local filesystem.
  minio:
    profiles: ["minio"]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edb}:${POSTGRES_PASSWORD:-edb_secret}@db:5432/${POSTGRES_DB:-edb_circulars}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /data/files
      MINIO_ENDPOINT: minio:9000
      SOURCES_CONFIG_PATH: /config/sources.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./config:/config:ro
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A app.worker.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edb}:${POSTGRES_PASSWORD:-edb_secret}@db:5432/${POSTGRES_DB:-edb_circulars}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /data/files
      MINIO_ENDPOINT: minio:9000
      SOURCES_CONFIG_PATH: /config/sources.yaml
    volumes:
      - ./config:/config:ro
      - filedata:/data/files
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started

  beat:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: celery -A app.worker.celery_app beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edb}:${POSTGRES_PASSWORD:-edb_secret}@db:5432/${POSTGRES_DB:-edb_circulars}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      LOCAL_STORAGE_PATH: /data/files
      SOURCES_CONFIG_PATH: /config/sources.yaml
    volumes:
      - ./config:/config:ro
    depends_on:
      - worker

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      PORT: "4000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_DEFAULT_LOCALE: ${NEXT_PUBLIC_DEFAULT_LOCALE:-zh-HK}
    ports:
      - "4000:4000"
    depends_on:
      - api

  # Optional Dify stack placeholder — enable with: docker compose --profile dify up -d
  # Replace with official Dify services when needed; see docker/dify/README.md
  dify-placeholder:
    profiles: ["dify"]
    image: alpine:3.20
    command: ["sh", "-c", "echo 'Mount official Dify compose under docker/dify and set DIFY_ENABLED=true' && sleep infinity"]

volumes:
  pgdata:
  filedata:
  miniodata:
