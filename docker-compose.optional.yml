# Local / optional services — do NOT add this file to Coolify compose list.
# Coolify only needs docker-compose.yml + docker-compose.coolify.yml.
#
#   docker compose -f docker-compose.yml -f docker-compose.optional.yml --profile minio up -d
#   docker compose -f docker-compose.yml -f docker-compose.optional.yml --profile tools up -d adminer
#   docker compose -f docker-compose.yml -f docker-compose.optional.yml --profile dify up -d

services:
  minio:
    profiles: ["minio"]
    # quay.io avoids Docker Hub anonymous pull limits on some hosts.
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  adminer:
    profiles: ["tools"]
    image: adminer:4
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
      ADMINER_DESIGN: pepa-linha-dark
    depends_on:
      db:
        condition: service_healthy

  dify-placeholder:
    profiles: ["dify"]
    image: alpine:3.20
    command: ["sh", "-c", "echo 'Mount official Dify compose under docker/dify and set DIFY_ENABLED=true' && sleep infinity"]

volumes:
  miniodata:
